[project]
name = "atomise"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "toml",
    "imap-tools",
    "feedgenerator",
    "python-slugify",
    "beautifulsoup4",
    "lxml-html-clean",
    "click",
]

[project.scripts]
atomise = "atomise:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
